name: MKV Filter Metadata CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mkv-filter-metadata/**'
      - '.github/workflows/mkv-filter-metadata-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'mkv-filter-metadata/**'
      - '.github/workflows/mkv-filter-metadata-ci.yml'

jobs:
  lint:
    name: Lint & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkv-filter-metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/mkv-filter-metadata-setup

      - name: Frontend check
        run: pnpm -F frontend check

      - name: Check for dead code
        run: pnpm run check:deadcode

      - name: Rust format check
        run: cargo fmt --manifest-path backend/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

  test:
    name: Test Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkv-filter-metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/mkv-filter-metadata-setup

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce test coverage
        uses: GabrielBB/xvfb-action@v1
        with:
          run: pnpm run test:coverage
          working-directory: mkv-filter-metadata

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mkv-filter-metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/mkv-filter-metadata-setup

      - name: Build Application
        uses: GabrielBB/xvfb-action@v1
        env:
          CARGO_PROFILE_RELEASE_LTO: false
        with:
          run: pnpm exec tauri build --no-bundle
          working-directory: mkv-filter-metadata

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mkv-filter-metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/mkv-filter-metadata-setup

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests
        run: pnpm run test:coverage

  test-macos:
    name: Test on macOS
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUST_BACKTRACE: "1"
    defaults:
      run:
        working-directory: mkv-filter-metadata
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/mkv-filter-metadata-setup

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests
        run: pnpm run test:coverage
